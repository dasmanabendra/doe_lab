[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doelab"
version = "0.1.0"
description = "Desktop app for Design of Experiments, metamodeling, and multi-objective optimization"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "pymoo>=0.6.1",
    "pyqtgraph>=0.13",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
doelab = "doelab.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
